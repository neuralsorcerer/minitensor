[package]
name = "engine"
version = "0.2.1"
edition = "2024"
authors.workspace = true
description = "High-performance tensor operations and automatic differentiation library"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tensor", "deep-learning", "automatic-differentiation", "machine-learning"]
categories = ["science", "mathematics"]

[dependencies]
# Core dependencies
num-traits = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# Memory management
parking_lot = { workspace = true }

# Special functions
libm = { workspace = true }

# SIMD and performance
rayon = { workspace = true }
matrixmultiply = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }

# System information
num_cpus = { workspace = true }
libc = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_distr = { workspace = true }
statrs = { workspace = true }

# BLAS integration (optional for now)
blas-src = { version = "0.14", features = ["openblas"], optional = true }
# Pin `openblas-src` to the system library. Its default is to download and
# compile OpenBLAS from source, which is what `--features blas` used to do
# (and fail at, on any machine without network access to the tarball).
openblas-src = { version = "0.10", features = ["system"], default-features = false, optional = true }
cblas = { version = "0.5", optional = true }

# GPU backends (optional). `metal` is declared per-target below: it links Apple
# frameworks, so having it here would make `--features gpu` unbuildable
# everywhere else.
cudarc = { workspace = true, optional = true }
opencl3 = { workspace = true, optional = true }

# Plugin system (optional)
libloading = { version = "0.9", optional = true }

# Serialization dependencies
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }
rmp-serde = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Metal is only reachable on Apple platforms. Declaring it here rather than in
# `[dependencies]` means enabling the `metal` feature on Linux/Windows resolves
# to nothing instead of failing inside `core-graphics-types`, so the composite
# `gpu` feature stays buildable on every platform and simply contributes no
# Metal backend where there cannot be one.
[target.'cfg(target_vendor = "apple")'.dependencies]
metal = { workspace = true, optional = true }

[features]
default = ["cpu", "hardware", "debug"]
cpu = []
# Hardware profiling/optimizer subsystem (`engine::hardware`). On by default
# for compatibility; not used by any tensor/autograd execution path, so
# `default-features = false` builds can drop it (with `cpu` re-enabled).
hardware = []
# Debugging/introspection utilities (`engine::debug`): tensor inspector, graph
# visualizer, memory tracker, op profiler. On by default for compatibility (the
# Python bindings expose them); not used by any tensor/autograd execution path,
# so `default-features = false` builds can drop it (with `cpu` re-enabled).
debug = []
cuda = ["dep:cudarc"]
metal = ["dep:metal"]
opencl = ["dep:opencl3"]
gpu = ["cuda", "metal", "opencl"]
conv = []
dropout = []
normalization = []
dynamic-loading = ["dep:libloading"]
blas = ["dep:blas-src", "dep:openblas-src", "dep:cblas"]

[dev-dependencies]
proptest = "1.11"
# Used only by tests/performance_tests.rs as a comparison baseline.
ndarray = { workspace = true }
approx = "0.5"

[[example]]
name = "hardware_detection"
required-features = ["hardware"]

[[example]]
name = "metal_demo"
required-features = ["metal"]

[[example]]
name = "opencl_demo"
required-features = ["opencl"]
