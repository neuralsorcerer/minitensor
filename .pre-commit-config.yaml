repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  # Keep in step with the `black` lower bound in pyproject's `dev` extra. The
  # two disagree about `textwrap.dedent("""...""")` -- 25.9.0 splits the call
  # across lines, 26.5 hugs the string back inside the parentheses -- so a
  # contributor who formats with the version the `dev` extra installs writes
  # something this hook then rejects, and vice versa. There is no formatting
  # that satisfies both.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        additional_dependencies: ["black[jupyter]"]
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
