name: Tests (MacOS)

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Python + Rust bindings)
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin"
          maturin develop
          python -m pip install ".[dev]"

      - name: Run Rust tests
        shell: bash
        run: |
          cargo test --manifest-path engine/Cargo.toml
          cargo test --manifest-path bindings/Cargo.toml

      - name: Run Python tests
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -v tests/

  # `engine/src/backends/metal` is ~1000 lines that no CI job has ever
  # compiled. The `metal` crate links Apple frameworks, so it is declared only
  # for Apple targets and every `metal` cfg is paired with `target_vendor =
  # "apple"`: off macOS the feature resolves to nothing and the backend is not
  # built at all. This is the only runner that can look at it.
  #
  # Advisory until it has been seen green: nobody knows whether that code still
  # compiles against the pinned `metal` release, and a first run that fails
  # should report a problem, not block unrelated work. Drop
  # `continue-on-error` once it passes, so the coverage actually holds.
  metal-backend:
    name: metal backend (advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Type-check the Metal backend
        run: cargo check -p engine --features metal --all-targets
