name: Lints

on: [push, pull_request]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  # The `clippy` job below only covers the default feature set, so the optional
  # backends and the minimal build rot unnoticed: `--features cuda` had already
  # accumulated failures nobody would see without enabling it.
  #
  # `metal` is covered on the macOS runner instead (test_macos.yml) because that
  # is the only place the backend actually compiles; the `gpu` entry below is
  # what keeps it from breaking everyone else, since `gpu` turns the `metal`
  # feature on unconditionally and must still build where there is no Metal.
  #
  # `blas` was excluded here for needing a system OpenBLAS, and in that gap it
  # stopped compiling entirely -- `cblas` takes slices where the call site
  # passed raw pointers, and `blas-src` was never referenced so its link
  # directive never reached the linker. It is covered by its own job below,
  # which installs libopenblas-dev.
  features:
    name: clippy (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-default-features
            args: --no-default-features --features cpu
          - label: cuda
            args: --features cuda
          - label: opencl
            args: --features opencl
          - label: gpu
            args: --features gpu
          - label: dynamic-loading
            args: --features dynamic-loading
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: Run clippy (deny warnings)
        run: cargo clippy -p engine --all-targets ${{ matrix.args }} -- -D warnings

  # Separate from the matrix above because it needs a system library. Tests, not
  # just clippy: a GEMM that links is not necessarily a GEMM that computes the
  # same thing as the `matrixmultiply` path it replaces.
  blas:
    name: blas (system OpenBLAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: blas
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Run clippy (deny warnings)
        run: cargo clippy -p engine --all-targets --features blas -- -D warnings
      - name: Run tests against BLAS
        run: cargo test -p engine --features blas
      # Every job above passes `-p engine`, which is how `blas` came to be
      # unreachable from the Python extension without anyone noticing: the
      # bindings crate never forwarded it, so `maturin develop --features blas`
      # failed with "the package 'bindings' does not contain this feature".
      # The extension is how almost everyone builds this, so it needs its own
      # check rather than being inferred from the engine's.
      #
      # Building it is not enough on its own. This step used to stop at a wheel
      # and throw it away, which proves the feature forwards and links but runs
      # none of the library through it -- and the Python suite had an assertion
      # that only holds on the default GEMM (two routes to the same product
      # agreeing bit for bit, which OpenBLAS breaks for some shapes by
      # dispatching them to a different kernel). Install it and run the suite.
      # `pip install ".[dev]"` builds the project too, with default features and
      # no way to pass `--features`. Whether it actually reinstalls over an
      # existing same-version install is a pip detail not worth depending on, so
      # it runs first and `maturin develop` writes the extension last. Ordered
      # the other way, a pip that does reinstall would quietly replace the BLAS
      # build and the step below would test the default GEMM twice.
      - name: Install the Python extension with BLAS
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin[patchelf]"
          python -m pip install ".[dev]"
          maturin develop --release --features blas

      - name: Run the Python suite against BLAS
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -q tests/

  # examples/rust_plugin_example is its own workspace, so neither the
  # `cargo fmt --all` / `cargo clippy` in pre-commit nor the workspace clippy
  # job below ever looked at it. It had drifted out of rustfmt compliance and
  # failed `-D warnings`.
  plugin-example:
    name: plugin example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rust_plugin_example
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rust_plugin_example
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
