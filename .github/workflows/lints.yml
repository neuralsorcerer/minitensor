name: Lints

on: [push, pull_request]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  # The `clippy` job below only covers the default feature set, so the optional
  # backends and the minimal build rot unnoticed: `--features cuda` had already
  # accumulated failures nobody would see without enabling it.
  #
  # `blas` is missing here on purpose: it needs a system OpenBLAS. `metal` is
  # covered on the macOS runner instead (test_macos.yml) because that is the
  # only place the backend actually compiles; the `gpu` entry below is what
  # keeps it from breaking everyone else, since `gpu` turns the `metal` feature
  # on unconditionally and must still build where there is no Metal.
  features:
    name: clippy (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-default-features
            args: --no-default-features --features cpu
          - label: cuda
            args: --features cuda
          - label: opencl
            args: --features opencl
          - label: gpu
            args: --features gpu
          - label: dynamic-loading
            args: --features dynamic-loading
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      - name: Run clippy (deny warnings)
        run: cargo clippy -p engine --all-targets ${{ matrix.args }} -- -D warnings

  # examples/rust_plugin_example is its own workspace, so neither the
  # `cargo fmt --all` / `cargo clippy` in pre-commit nor the workspace clippy
  # job below ever looked at it. It had drifted out of rustfmt compliance and
  # failed `-D warnings`.
  plugin-example:
    name: plugin example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rust_plugin_example
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/rust_plugin_example
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
