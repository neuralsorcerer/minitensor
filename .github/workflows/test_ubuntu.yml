name: Tests (Ubuntu)

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Python + Rust bindings)
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin[patchelf]"
          maturin develop
          python -m pip install ".[dev]"

      - name: Run Rust tests
        shell: bash
        run: |
          cargo test --manifest-path engine/Cargo.toml
          cargo test --manifest-path bindings/Cargo.toml

      - name: Run Python tests
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -v tests/

      # `maturin develop` and PEP 517 installs skip the auditwheel step, so a
      # broken [tool.maturin] compatibility setting can pass every test above
      # while `maturin build` release wheels fail (it happened: the "pypi"
      # value panicked maturin 1.14 and CI stayed green). Build one wheel per
      # run to keep the release path honest; debug profile reuses the target
      # dir, so this is cheap.
      - name: Build wheel (release-path guard)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin build --out /tmp/wheel-guard
          ls /tmp/wheel-guard/*.whl

  # The plugin path is the library's extension story, and until this job
  # existed nothing ran it: `tests/test_plugin_loading.py` skips itself unless
  # the extension was built with `dynamic-loading` *and* the example plugin is
  # compiled, neither of which any workflow did. Eleven tests reported green by
  # never executing -- the same shape that let the `blas` feature stop
  # compiling unnoticed.
  plugin:
    name: dynamic plugin loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin

      - name: Build the example plugin
        run: cargo build --release --manifest-path examples/rust_plugin_example/Cargo.toml

      - name: Install with dynamic-loading
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin[patchelf]"
          # `pip install ".[dev]"` builds the project as well, with default
          # features, so it goes first and `maturin develop` writes the
          # extension last -- otherwise a pip that reinstalls over the existing
          # same-version install would drop `dynamic-loading` again.
          python -m pip install ".[dev]"
          maturin develop --release --features dynamic-loading

      # Skipping is the failure mode this job exists to prevent, so a run that
      # skips has to be red rather than green.
      - name: Run plugin tests, failing if any skip
        shell: bash
        run: |
          source .venv/bin/activate
          output=$(pytest tests/test_plugin_loading.py -q -rs 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::plugin tests skipped -- the plugin path was not exercised"
            exit 1
          fi
