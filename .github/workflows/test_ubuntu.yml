name: Tests (Ubuntu)

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Python + Rust bindings)
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin[patchelf]"
          maturin develop
          python -m pip install ".[dev]"

      - name: Run Rust tests
        shell: bash
        run: |
          cargo test --manifest-path engine/Cargo.toml
          cargo test --manifest-path bindings/Cargo.toml

      - name: Run Python tests
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest -v tests/

      # `maturin develop` and PEP 517 installs skip the auditwheel step, so a
      # broken [tool.maturin] compatibility setting can pass every test above
      # while `maturin build` release wheels fail (it happened: the "pypi"
      # value panicked maturin 1.14 and CI stayed green). Build one wheel per
      # run to keep the release path honest; debug profile reuses the target
      # dir, so this is cheap.
      - name: Build wheel (release-path guard)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          maturin build --out /tmp/wheel-guard
          ls /tmp/wheel-guard/*.whl

      # The size of the shipped extension has never been measured by anything.
      # Every `maturin` invocation above is the debug profile, including the
      # guard step, so the only figure the project stands behind is a comment
      # in Cargo.toml -- written by hand, from a machine nobody can check, and
      # free to drift by a factor without a single job going red. This builds
      # the artifact users actually download and fails if it has grown past a
      # budget.
      - name: Release wheel size budget
        if: matrix.python-version == '3.12'
        shell: bash
        env:
          # Measured at 12.16 MiB on rustc 1.98 / cp312: 10.64 on 1.94 before
          # the NumPy provider, the gemv path and the newer vector kernels,
          # 11.78 before the element-wise map cores gained an AVX2 build.
          # The budget is set to catch a step change -- a dependency that does not get stripped, a
          # generic instantiated across every dtype -- and not to ration the
          # ordinary growth of the engine, so there is real headroom and a
          # change that legitimately needs more should raise this number with
          # the reason in its commit message.
          MAX_EXTENSION_MIB: 14
        run: |
          source .venv/bin/activate
          maturin build --release --out /tmp/wheel-size
          python - <<'PY'
          import glob, os, sys, zipfile

          budget = int(os.environ["MAX_EXTENSION_MIB"]) * 1024 * 1024
          wheel = glob.glob("/tmp/wheel-size/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              extension = max(
                  (info for info in archive.infolist() if info.filename.endswith(".so")),
                  key=lambda info: info.file_size,
              )
          megabytes = extension.file_size / 1024 / 1024
          print(f"{extension.filename}: {megabytes:.2f} MiB")
          print(f"wheel: {os.path.getsize(wheel) / 1024 / 1024:.2f} MiB")
          if extension.file_size > budget:
              sys.exit(
                  f"extension is {megabytes:.2f} MiB, over the "
                  f"{budget / 1024 / 1024:.0f} MiB budget"
              )
          PY

  # The plugin path is the library's extension story, and until this job
  # existed nothing ran it: `tests/test_plugin_loading.py` skips itself unless
  # the extension was built with `dynamic-loading` *and* the example plugin is
  # compiled, neither of which any workflow did. Eleven tests reported green by
  # never executing -- the same shape that let the `blas` feature stop
  # compiling unnoticed.
  plugin:
    name: dynamic plugin loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin

      - name: Build the example plugin
        run: cargo build --release --manifest-path examples/rust_plugin_example/Cargo.toml

      - name: Install with dynamic-loading
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U "pip>=22.1.2"
          python -m pip install "maturin[patchelf]"
          # `pip install ".[dev]"` builds the project as well, with default
          # features, so it goes first and `maturin develop` writes the
          # extension last -- otherwise a pip that reinstalls over the existing
          # same-version install would drop `dynamic-loading` again.
          python -m pip install ".[dev]"
          maturin develop --release --features dynamic-loading

      # Skipping is the failure mode this job exists to prevent, so a run that
      # skips has to be red rather than green.
      - name: Run plugin tests, failing if any skip
        shell: bash
        run: |
          source .venv/bin/activate
          output=$(pytest tests/test_plugin_loading.py -q -rs 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::plugin tests skipped -- the plugin path was not exercised"
            exit 1
          fi
