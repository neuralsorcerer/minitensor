[package]
name = "bindings"
version = "0.2.1"
edition = "2024"
authors.workspace = true
description = "Python bindings for minitensor"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "minitensor"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
pyo3 = { workspace = true }
numpy = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
parking_lot = { workspace = true }
# The engine's gradient maps are keyed with this hasher, and a backward
# written in Python has to hand one back.
rustc-hash = { workspace = true }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[features]
extension-module = ["pyo3/extension-module"]
# Must forward to the engine: `bindings/src/plugins.rs` gates
# `plugins.load_plugin()` on this feature and imports `engine::load_plugin`,
# which only exists when the engine's own `dynamic-loading` feature pulls in
# `libloading`. Declared as an empty feature, enabling it failed to compile
# (`unresolved import engine::load_plugin`), so Python plugin loading could
# never be turned on at all.
dynamic-loading = ["engine/dynamic-loading"]
# Same forwarding requirement, and the same bug: the engine's `blas` feature was
# reachable from `cargo`, and every CI job that exercised it used `-p engine`, so
# nobody noticed that `maturin develop --features blas` fails outright --
# "the package 'bindings' does not contain this feature". The Python extension is
# how almost everyone builds this, which made a documented performance option
# unreachable from the only path that matters. Measured through the engine
# example on x86-64 with OpenBLAS 0.3.26, it is worth 1.4x-2.0x on square f32
# GEMM (1024x1024: 9.22ms -> 6.55ms, 233 -> 328 GFLOP/s).
blas = ["engine/blas"]
