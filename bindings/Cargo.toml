[package]
name = "bindings"
version = "0.2.1"
edition = "2024"
authors.workspace = true
description = "Python bindings for minitensor"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "minitensor"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
pyo3 = { workspace = true }
numpy = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
parking_lot = { workspace = true }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[features]
extension-module = ["pyo3/extension-module"]
# Must forward to the engine: `bindings/src/plugins.rs` gates
# `plugins.load_plugin()` on this feature and imports `engine::load_plugin`,
# which only exists when the engine's own `dynamic-loading` feature pulls in
# `libloading`. Declared as an empty feature, enabling it failed to compile
# (`unresolved import engine::load_plugin`), so Python plugin loading could
# never be turned on at all.
dynamic-loading = ["engine/dynamic-loading"]
