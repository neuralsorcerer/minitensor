[workspace]
members = [
    "engine",
    "bindings"
]
resolver = "2"

[workspace.package]
authors = ["Soumyadip Sarkar"]
license = "Apache-2.0"
repository = "https://github.com/neuralsorcerer/minitensor"
homepage = "https://github.com/neuralsorcerer/minitensor#README"

[workspace.dependencies]
# Core dependencies
ndarray = "0.17"
num-traits = "0.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.21"

# Memory management
parking_lot = "0.12"

# SIMD and performance
rayon = "1.12"
matrixmultiply = { version = "0.3", features = ["threading"] }
smallvec = "1.15"
rustc-hash = "2.1"

# GPU backends
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13020"] }
metal = "0.33"
opencl3 = "0.12"

# System information
num_cpus = "1.17"
libc = "0.2"

# Random number generation
rand = "0.10"
rand_distr = "0.6"
statrs = "0.19"

# Special mathematical functions
libm = "0.2"

# Python bindings
pyo3 = { version = "0.29", features = ["auto-initialize", "multiple-pymethods"] }
numpy = "0.29"


# Release builds are what ship in the wheel and what every benchmark quotes.
# Cargo's defaults leave a lot on the table here: no cross-crate inlining, and
# full debug symbols retained in the artifact.
# Measured on the extension module, each step over the one above it:
#
#   cargo defaults                     17.21 MB    ~75 s
#   strip only                         12.44 MB     97 s
#   strip + thin LTO (codegen-units 16) 12.44 MB     92 s
#   strip + thin LTO + codegen-units 1  9.80 MB    176 s
#
# Note the third row: thin LTO on its own changes nothing here. Shrinking the
# unit count is what lets it merge and inline across the crate boundaries the
# hot kernels cross constantly -- rayon, matrixmultiply, and the generic
# `ops::map` combinators -- and that is where both the size and the small
# runtime gain come from. The two settings only pay off together.
[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are a large fraction of the shipped extension and buy nothing at
# runtime; a backtrace-grade build can override this.
strip = "symbols"
# Left at "unwind" deliberately: pyo3 converts Rust panics into Python
# exceptions, which requires unwinding. "abort" would shrink the binary further
# and turn every panic into a hard process kill.
panic = "unwind"
