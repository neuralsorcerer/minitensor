[workspace]
members = [
    "engine",
    "bindings"
]
resolver = "2"

[workspace.package]
authors = ["Soumyadip Sarkar"]
license = "Apache-2.0"
repository = "https://github.com/neuralsorcerer/minitensor"
homepage = "https://github.com/neuralsorcerer/minitensor#README"

[workspace.dependencies]
# Core dependencies
ndarray = "0.17"
num-traits = "0.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.21"

# Memory management
parking_lot = "0.12"

# SIMD and performance
rayon = "1.12"
# Deliberately without the "threading" feature: `gemm_f32`/`gemm_f64` split
# large products across rayon themselves. Letting matrixmultiply's own pool
# also try to split the same call oversubscribes the machine, and its pool
# cannot help at all when the output has few rows -- which is every GEMM in an
# inference batch, an attention head, or a recurrent step.
matrixmultiply = { version = "0.3" }
smallvec = "1.15"
rustc-hash = "2.1"

# GPU backends
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13020"] }
metal = "0.33"
opencl3 = "0.12"

# System information
num_cpus = "1.17"
libc = "0.2"

# Random number generation
rand = "0.10"
rand_distr = "0.6"

# Special mathematical functions
libm = "0.2"

# Python bindings
pyo3 = { version = "0.29", features = ["auto-initialize", "multiple-pymethods"] }
numpy = "0.29"


# Release builds are what ship in the wheel and what every benchmark quotes.
# Cargo's defaults leave a lot on the table here: no cross-crate inlining, and
# full debug symbols retained in the artifact.
# Measured on the extension module, each step over the one above it:
#
#   cargo defaults                     17.21 MB    ~75 s
#   strip only                         12.44 MB     97 s
#   strip + thin LTO (codegen-units 16) 12.44 MB     92 s
#   strip + thin LTO + codegen-units 1  9.80 MB    176 s
#
# Note the third row: thin LTO on its own changes nothing here. Shrinking the
# unit count is what lets it merge and inline across the crate boundaries the
# hot kernels cross constantly -- rayon, matrixmultiply, and the generic
# `ops::map` combinators -- and that is where both the size and the small
# runtime gain come from. The two settings only pay off together.
[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are a large fraction of the shipped extension and buy nothing at
# runtime; a backtrace-grade build can override this.
strip = "symbols"
# Left at "unwind" deliberately. This is the one release setting that is a
# judgement rather than a free win, so it is worth writing down what it costs.
#
# "abort" is smaller. Measured on the extension module, changing nothing else:
#
#   panic = "unwind"    11,231,616 bytes
#   panic = "abort"     10,367,936 bytes    -863,680  (-7.7%)
#
# It is not taken, because unwinding is load-bearing here rather than
# incidental. pyo3 turns a Rust panic into a Python exception by catching the
# unwind at the boundary, and `tensor/python/convert.rs` catches one itself
# around the conversion of arbitrary Python objects. Without unwinding both
# become `abort()`: the interpreter dies with SIGABRT, no traceback, no
# `except`, and a notebook or a training run loses everything in memory.
# `tests/test_no_panics_on_bad_input.py` asserts across its whole surface that
# awkward input is *declined* rather than fatal, and every one of those cases
# would become a process kill.
#
# 864 KB on an 11 MB artifact does not buy that. An embedder linking the engine
# as a plain Rust crate, with no Python boundary to unwind to, can have the
# smaller build through `release-min` below.
panic = "unwind"

# The release build with `panic = "abort"`, for embedders with no Python
# boundary: `cargo build --profile release-min`.
#
# Do not ship a wheel from this. It exists so the trade above is available to
# whoever it suits, not because it suits the extension module -- see the note
# on `panic` for what it costs there.
[profile.release-min]
inherits = "release"
panic = "abort"
